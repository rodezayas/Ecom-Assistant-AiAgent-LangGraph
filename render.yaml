services:
  - type: web
    name: langgraph-ecom-assistant
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_BASE_URL
        value: https://alta-norma-fashion.lovable.app
      - key: TELEGRAM_WEBHOOK_PUBLIC_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-20250514
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: VECTOR_STORE_PATH
        value: /tmp/data/vectorstore
      - key: CATALOG_PATH
        value: ./data/catalog/products.json
      - key: KNOWLEDGE_BASE_DIR
        value: ./data/knowledge
